<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mehmet Gümrah</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f7fb;
        color: #1f2933;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at top left, rgba(48, 151, 209, 0.22), transparent 30rem),
          linear-gradient(135deg, #f7fafc 0%, #e8eef5 100%);
      }

      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .intro {
        width: min(100%, 860px);
      }

      p {
        margin: 0;
      }

      .eyebrow {
        color: #277196;
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin-bottom: 1rem;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #102a43;
        font-size: clamp(3.2rem, 12vw, 8rem);
        font-weight: 800;
        letter-spacing: 0;
        line-height: 0.95;
      }

      .summary {
        color: #52606d;
        font-size: clamp(1.05rem, 2vw, 1.35rem);
        line-height: 1.6;
        margin-top: 1.5rem;
        max-width: 36rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin-top: 2rem;
      }

      a {
        align-items: center;
        border: 1px solid #bcccdc;
        border-radius: 8px;
        color: #102a43;
        display: inline-flex;
        font-weight: 700;
        min-height: 2.75rem;
        padding: 0 1rem;
        text-decoration: none;
      }

      a.primary {
        background: #102a43;
        border-color: #102a43;
        color: #ffffff;
      }

      @media (max-width: 560px) {
        main {
          align-items: flex-start;
          padding-top: 6rem;
        }

        h1 {
          font-size: clamp(3rem, 18vw, 5rem);
        }

        .actions {
          flex-direction: column;
        }

        a {
          justify-content: center;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro" aria-label="Kişisel tanıtım">
        <p class="eyebrow">Kişisel Website</p>
        <h1>Mehmet<br>Gümrah</h1>
        <p class="summary">
          Merhaba, ben Mehmet Gümrah. Burası projelerimi, işlerimi ve iletişim bilgilerimi paylaşacağım kişisel web sitem.
        </p>
        <div class="actions" aria-label="Bağlantılar">
          <a class="primary" href="mailto:">İletişime Geç</a>
          <a href="https://github.com/MGumrah">GitHub</a>
        </div>
      </section>
    </main>
  </body>
</html>
