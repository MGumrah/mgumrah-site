<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3f7f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1819" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="İngilizce">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/merve/ingilizce/manifest.webmanifest">
<link rel="apple-touch-icon" href="/merve/ingilizce/ikon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/merve/ingilizce/ikon-192.png">
<title>Merve · İngilizce</title>
<style>
:root{--bg:#f3f7f6;--card:#ffffff;--text:#16262a;--muted:#587076;--line:#d6e2e1;--accent:#0f766e;--accent-text:#ffffff;--ok:#15803d;--okbg:#e5f6ea;--bad:#b91c1c;--badbg:#fdecec;--sel:#e0f3f0;--warnbg:#fff4de;--warn:#92580a}
@media (prefers-color-scheme: dark){:root{--bg:#0d1819;--card:#142324;--text:#e6f0ef;--muted:#93aaa8;--line:#25403f;--accent:#2dd4bf;--accent-text:#04201c;--ok:#4ade80;--okbg:#10301e;--bad:#f87171;--badbg:#3a1618;--sel:#12363a;--warnbg:#3a2a0e;--warn:#fbbf24}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 56px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;padding-top:max(10px,env(safe-area-inset-top))}
nav .in{max-width:760px;margin:0 auto;padding:0 18px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav .in::-webkit-scrollbar{display:none}
nav a{flex:none;font-size:.9rem;text-decoration:none;color:var(--text);border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:99px}
nav a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
h1{font-size:1.6rem;line-height:1.25;margin:24px 0 6px}
h2{font-size:1.2rem;margin:0 0 6px}
h3{font-size:1.02rem;margin:20px 0 8px}
p{margin:0 0 12px}
a{color:var(--accent)}
.muted{color:var(--muted)}
.kart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 20px;margin-top:16px}
.kart.vurgu{border-color:var(--accent)}
button{font:inherit;color:inherit}
.dugme{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);padding:11px 18px;border-radius:11px;text-decoration:none;min-height:46px}
.dugme.ana{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.dugme:disabled{opacity:.45;cursor:default}
.satir{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.lnk{font:inherit;font-size:.9rem;padding:0;border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer}
.rozet{display:inline-block;font-size:2.4rem;font-weight:800;line-height:1.1;color:var(--accent);margin:2px 0 4px}
.chip{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:.03em;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--muted);vertical-align:2px;margin-left:6px}
.ilerleme{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.ilerleme > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.ust{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;color:var(--muted)}
.soru{font-size:1.2rem;line-height:1.5;font-weight:600;margin:14px 0 16px}
.bosluk{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);text-align:center;color:var(--muted)}
.metin{background:var(--bg);border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px;margin:10px 0;font-size:.97rem}
.metin .l{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.opts{display:grid;gap:9px}
.opts button{font:inherit;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);padding:13px 15px;border-radius:11px;min-height:50px}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button.secili{background:var(--sel);border-color:var(--accent);font-weight:600}
.opts button.good{background:var(--okbg);border-color:var(--ok)}
.opts button.wrong{background:var(--badbg);border-color:var(--bad)}
.opts button:disabled{cursor:default}
.opts button.bil{color:var(--muted);border-style:dashed}
.fb{font-size:.92rem;margin-top:8px;padding:9px 12px;border-radius:9px}
.fb.ok{background:var(--okbg)}
.fb.no{background:var(--badbg)}
.en{font-weight:600}
.tr{color:var(--muted);font-size:.92em}
code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:.92em}
.tw{overflow-x:auto;margin:8px 0 14px}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.kural{background:var(--sel);border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;margin:12px 0}
.ipucu{background:var(--warnbg);border-left:3px solid var(--warn);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:.95rem}
.mine{background:var(--badbg);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:.93rem}
.mine b{color:var(--bad)}
.mine p{margin:0 0 6px}
.kartlar{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px;margin:12px 0}
.kk{font:inherit;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:11px 13px;min-height:88px}
.kk:hover{border-color:var(--accent)}
.kk .b{display:none}
.kk.flip .f{display:none}
.kk.flip .b{display:block}
.kk .w{font-weight:700}
.kk .x{font-size:.82rem;color:var(--muted);margin-top:4px}
ul.l{margin:0 0 12px;padding-left:20px}
ul.l li{margin-bottom:4px}
.dersler{display:grid;gap:10px;margin-top:10px}
.ders{display:block;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px}
.ders:hover{border-color:var(--accent)}
.ders b{font-size:1.02rem}
.ders .d{font-size:.85rem;color:var(--muted);margin-top:2px}
.ders.calis,.ders.pekistir{border-color:var(--accent)}
.ders.tamam{opacity:.78}
.bolum-bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:.93rem}
.bolum-bar .ad{flex:0 0 74px}
.bolum-bar .cubuk{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bolum-bar .cubuk i{display:block;height:100%;background:var(--accent)}
.bolum-bar .sy{flex:0 0 56px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
details{margin:8px 0}
summary{cursor:pointer;font-weight:600}
.yanlis{border-top:1px dashed var(--line);padding:10px 0;font-size:.95rem}
.yanlis .k{font-size:.78rem;color:var(--muted)}
pre.rapor{white-space:pre-wrap;word-break:break-word;font:.84rem/1.55 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.adim{display:flex;gap:10px;margin-bottom:8px}
.adim b{flex:none;width:1.1em;color:var(--accent)}
footer{margin-top:28px;color:var(--muted);font-size:.85rem;text-align:center}
</style>
</head>
<body>
<nav aria-label="Bölümler"><div class="in" id="nav"></div></nav>
<div class="wrap"><main id="app"><noscript><p class="kart">Bu sayfanın çalışması için JavaScript gerekir.</p></noscript></main></div>
<script src="/merve/ingilizce/sorular.js"></script>
<script src="/merve/ingilizce/dersler.js"></script>
<script src="/merve/ingilizce/motor.js"></script>
<script src="/merve/ingilizce/uygulama.js"></script>
</body>
</html>
